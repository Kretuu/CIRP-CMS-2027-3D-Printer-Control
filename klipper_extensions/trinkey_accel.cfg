# Continuous Trinkey/BNO055 streaming for Motan and future hybrid control.
#
# Installation:
#   1. Copy this file into the printer's Klipper config directory.
#   2. Replace REPLACE_WITH_TRINKEY_USB_ID with the Trinkey entry reported by:
#        ls /dev/serial/by-id/
#   3. Add [include trinkey_accel.cfg] to printer.cfg and restart Klipper.
#
# If [vibration_test] is also configured, its trinkey_port must name the same
# device.  The two sections may coexist, but their acquisition modes cannot run
# simultaneously: stop Motan streaming before RUN_VIBRATION_TEST.

[trinkey_accel]
serial: /dev/serial/by-id/REPLACE_WITH_TRINKEY_USB_ID

# Acquire and publish both physical accelerometers.  Motan reads this setting
# and creates one subscription for each listed sensor.
sensors: base, toolhead

# Conservative settings for the 10 Hz and 35 Hz evaluation trajectories.
# Validate firmware/host loss counters before trying rate=1000 and use a
# bandwidth appropriate for the higher Nyquist frequency.
rate: 400
batch_size: 4
bandwidth: 125

# BNO055 acceleration mode uses 100 LSB/(m/s^2), hence 10 mm/s^2 per LSB.
raw_lsb_mm_s2: 10.0

# Print-time synchronization and host publication settings.
sync_interval: 1.0
initial_sync_samples: 12
api_update_interval: 0.100
max_host_samples: 20000
