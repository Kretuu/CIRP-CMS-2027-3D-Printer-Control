# Nominal limited-preview filtered B-spline controller.
#
# These discrete, unity-DC models were generated from the 3 m/s^2 sweeps in
# data/raw/frf_sweeps/2026-08-11_* by frf_sweep_analysis.m, using the
# experimentally
# observed non-reacting frequency cut-offs.  Their sample time is 1 ms.
# Keep the controller disabled for homing and initial checkout, then enable it
# explicitly with: SET_FILTERED_BSPLINE ENABLE=1
#
# Do not configure [input_shaper] at the same time.  Both features transform
# the requested XY kinematics and this dissertation evaluates them separately.

[filtered_bspline]
enabled: False
mode: standard

# Hybrid FBF uses the core-paper regressor with q=4 nominal predictions and
# p=50 past residuals.  It runs standard FBF during this warm-up, then starts
# using the learned residual model.  Lambda=0.01 matches the paper and is the
# regularization term in the dissertation least-squares equation.
hybrid_regularization: 0.01
hybrid_warmup_seconds: 5.5

# Coefficients are ordered as b0, b1, ... for powers of z^-1.
model_x_numerator:
    0,
    0.0001443224689716287,
    0.01079015528101108,
    -0.03540511497543435,
    0.05055228348337154,
    -0.03524846705683297,
    0.01033444206265832
model_x_denominator:
    1,
    -5.192281379356192,
    11.5698967403437,
    -14.13026406072429,
    9.964283659117569,
    -3.843955666473999,
    0.6334883283569609

model_y_numerator:
    0,
    0.03439681653857041,
    -0.2197613590789987,
    0.5949871288719601,
    -0.8736083120329019,
    0.7353031143125177,
    -0.3372880466793826,
    0.06606424423829817
model_y_denominator:
    1,
    -6.343700362070597,
    17.53332122359136,
    -27.3595136434532,
    26.01841980535296,
    -15.06836974791483,
    4.915967403941391,
    -0.6960310932770178
