# Nominal limited-preview filtered B-spline controller.
#
# These discrete, unity-DC models were generated from the 3 m/s^2 sweeps in
# data/raw/2026-07-20_* by frf_sweep_analysis.m.  Their sample time is 1 ms.
# Keep the controller disabled for homing and initial checkout, then enable it
# explicitly with: SET_FILTERED_BSPLINE ENABLE=1
#
# Do not configure [input_shaper] at the same time.  Both features transform
# the requested XY kinematics and this dissertation evaluates them separately.

[filtered_bspline]
enabled: False

